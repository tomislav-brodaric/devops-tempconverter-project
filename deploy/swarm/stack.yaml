services:
  proxy:
    image: docker.io/library/nginx:1.27-alpine
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - backend
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    deploy:
      mode: global

  db:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tempconverter}
      MYSQL_USER: ${DB_USER:-tempconverter}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  app:
    image: ${TEMPCONVERTER_IMAGE:-docker.io/tomislavb16/tempconverter:dev}
    command:
      - /bin/sh
      - -c
      - |
        export DB_PASS="$$(cat /run/secrets/db_password)"
        export SECRET_KEY="$$(cat /run/secrets/flask_secret_key)"
        exec python app.py
    environment:
      DB_USER: ${DB_USER:-tempconverter}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tempconverter}
      STUDENT: ${STUDENT:-Tomislav Brodarić}
      COLLEGE: ${COLLEGE:-Algebra Bernays University}
    secrets:
      - db_password
      - flask_secret_key
    networks:
      - backend
    deploy:
      replicas: 2
      endpoint_mode: dnsrr
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

networks:
  backend:
    driver: overlay

volumes:
  mysql-data:

configs:
  nginx_config:
    file: ./nginx.conf

secrets:
  db_password:
    external: true
    name: tempconverter_db_password
  db_root_password:
    external: true
    name: tempconverter_db_root_password
  flask_secret_key:
    external: true
    name: tempconverter_flask_secret_key
