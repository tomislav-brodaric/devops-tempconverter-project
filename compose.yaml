name: tempconverter

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tempconverter}
      MYSQL_USER: ${DB_USER:-tempconverter}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    image: localhost/tempconverter:dev
    build:
      context: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5000}:5000"
    environment:
      DB_USER: ${DB_USER:-tempconverter}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tempconverter}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      STUDENT: ${STUDENT:?Set STUDENT in .env}
      COLLEGE: ${COLLEGE:?Set COLLEGE in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
